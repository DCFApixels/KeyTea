<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3e6df4">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
    <link rel="icon" href="images/PasswordTeaIcon.svg" type="image/svg+xml">
    <title>Password Tea</title>

    <link rel="stylesheet" href="styles/global.css?v=1.1.0" type="text/css">
</head>
<body>
    <div  class="screen_group">

        <div class="screen" id="login_screen">
            <div class="form">
                <header>
                    <a href="https://github.com/DCFApixels/PasswordTea">
                        <img width="" src="images/PasswordTeaIcon.svg" alt="Password Tea">
                    </a>  
                    <h1>Master Password</h1>
                    <button id="clear_user_data_button" type="button" class="trnsp icon_button clear_storage_button" title="Clear local data" aria-label="Clear local data"></button>
                </header>
                <div class="input_button_pair">
                    <input class="field" title="Master password" placeholder="Enter master password..." type="password" name="" id="master_password_field">
                    <button type="button" id="master_password_continue_button" aria-label="Continue" aria-busy="false">
                        <span class="button_label">Continue</span>
                        <span class="button_spinner" aria-hidden="true"></span>
                    </button>
                </div>
                <p id="master_password_error" class="error_label hidden">Unable to initialize password generation.</p>
            </div>
        </div>

        <div class="screen" id="select_screen">
            <div class="form hidden">
                <header>
                    <a href="https://github.com/DCFApixels/PasswordTea">
                        <img width="" src="images/PasswordTeaIcon.svg" alt="Password Tea">
                    </a>  
                    <h1>Passwords</h1>
                    <button id="return_to_master_password" type="button" class="trnsp icon_button logout_button"></button>
                </header>

                <div class="records_list">
                    <ul id="passwords_list"> 
                        
                    </ul>
                </div>
                <button id="add_raw_password_button" type="button" class="icon_button records_list_add_button"></button>
                
                <div class="result_password_block">
                    <label>Password</label>
                    <input class="field" id="output_password" title="Password" readonly placeholder="Select any site..." type="password">
                    <button id="output_password_copy_button" type="button" class="icon_button copy">.</button>
                    <button id="output_password_show_button" type="button" class="icon_button show_aye on">.</button>
                </div>

                <label>User data</label>
                <div class="horizontal_buttons_group">
                    <button type="button" id="user_data_export_button">Export</button>
                    <button type="button" id="user_data_import_button">Import</button>
                </div>
            </div>
        </div>

        <div class="screen" id="edit_password_screen">
            <div class="form hidden">
                <header>
                    <a href="https://github.com/DCFApixels/PasswordTea">
                        <img width="" src="images/PasswordTeaIcon.svg" alt="Password Tea">
                    </a>  
                    <h1>Edit password info</h1>
                </header>
                <div class="label_input_pair">
                    <label>Name</label><input class="field" id="raw_password_name_field" type="text">
                </div>
                <div class="label_input_pair">
                    <label>User</label><input class="field" id="raw_password_user_field" type="text">
                </div>
                <div class="label_input_pair">
                    <label>Length</label><input class="field" id="raw_password_length_field" type="number">
                </div>
                <div class="label_input_pair">
                    <label>Version</label>
                    <input class="field" id="raw_password_version_field" type="number" value="1">
                    <button id="raw_password_up_version_button" type="button">Up</button>
                </div>

                <div class="records_list">
                    <ul id="charsets_list"> 

                    </ul>
                </div>
                <button id="add_charset_button" type="button" class="icon_button records_list_add_button"></button>

                <div class="horizontal_buttons_group">
                    <button id="raw_password_save_button" type="button" class="green">Save</button>
                    <button id="raw_password_cancel_button" type="button">Cancel</button>
                </div>

                <label id="raw_password_error_label" class="error_label hidden">error</label>
            </div>
        </div>

        <div class="screen" id="edit_charset_screen">
            <div class="form hidden">
                <header>
                    <a href="https://github.com/DCFApixels/PasswordTea">
                        <img width="" src="images/PasswordTeaIcon.svg" alt="Password Tea">
                    </a>  
                    <h1>Edit charset</h1>
                </header>
                <div class="label_input_pair">
                    <label>Name</label><input class="field" id="charset_name_field" type="text"><br>
                </div>
                <div class="label_input_pair">
                    <label>Charset</label><input class="field" id="charset_chars_field" type="text"><br>
                </div>
                <div class="label_input_pair">
                    <label>Priority</label><input class="field" id="charset_priority_field" type="text"><br>
                </div>
                <div class="auto_space"></div>
                <div class="horizontal_buttons_group">
                    <button id="charset_save_button" type="button" class="green">Save</button>
                    <button id="charset_cancel_button" type="button">Cancel</button>
                </div>

                <label id="charset_error_label" class="error_label hidden">error</label>
            </div>
        </div>
    </div>

    <div id="clear_user_data_dialog" class="modal_overlay hidden" role="dialog" aria-modal="true" aria-labelledby="clear_user_data_title" aria-describedby="clear_user_data_description">
        <div class="modal_dialog">
            <h2 id="clear_user_data_title">Clear local data?</h2>
            <p id="clear_user_data_description">All saved password records and custom character sets will be deleted from this browser. This action cannot be undone.</p>
            <div class="horizontal_buttons_group">
                <button id="clear_user_data_cancel_button" type="button">Cancel</button>
                <button id="clear_user_data_confirm_button" type="button" class="danger">Clear data</button>
            </div>
            <p id="clear_user_data_error" class="error_label hidden">Unable to clear saved data.</p>
        </div>
    </div>

    <div class="version"><span>1.1.0</span></div>
    
    <script src='scripts/Utils/Utility.js'></script>
    <script src='scripts/Utils/ImportExportDialogUtility.js'></script>

    <script src='scripts/Utils/StringUtility.js'></script>
    <script src='scripts/Utils/RandomUtility.js'></script>
    <script src="scripts/Utils/js-sha3/sha3.js"></script>
    <script src="scripts/Utils/PasswordKdf.js"></script>
    <script src="scripts/Utils/MYUID.js"></script>

    <script src="scripts/Data/Charset.js"></script>
    <script src="scripts/Data/RawPassword.js"></script>
    <script src="scripts/Data/User.js"></script>
    <script src="scripts/Generator.js"></script>

    <script src='scripts/Controllers/MasterPasswordController.js'></script>
    <script src='scripts/Controllers/SelectRawPasswordController.js'></script>
    <script src='scripts/Controllers/EditPasswordController.js'></script>
    <script src='scripts/Controllers/EditCharsetController.js'></script>
    <script src='scripts/Controllers/Elements/RawPasswordElementController.js'></script>
    <script src='scripts/Controllers/Elements/CharsetElementController.js'></script>

    <script src='scripts/Views/ViewBase.js'></script>
    <script src='scripts/Views/Elements/CharsetElementView.js'></script>
    <script src='scripts/Views/Elements/RawPasswordElementView.js'></script>
    <script src='scripts/Views/Screens/MasterPasswordScreenView.js'></script>
    <script src='scripts/Views/Screens/SelectScreenView.js'></script>
    <script src='scripts/Views/Screens/EditPasswordScreenView.js'></script>
    <script src='scripts/Views/Screens/EditCharsetScreenView.js'></script>

    <script src="scripts/Root.js"></script>
</body>
</html>
