<svg xmlns="http://www.w3.org/2000/svg" width="739" height="739" viewBox="256.5 166 739 739" role="img" aria-labelledby="title desc">
    <title id="title">Password Tea — monochrome decorative mark</title>
    <desc id="desc">A transparent black-and-white mark with an outlined cup, key, steam, and soft grounded shadows.</desc>

    <defs>
        <filter id="subject-shadow" x="-60%" y="-60%" width="240%" height="250%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="wide-blur"/>
            <feFlood flood-color="#000000" flood-opacity="0.78" result="wide-color"/>
            <feComposite in="wide-color" in2="wide-blur" operator="in" result="wide-shadow"/>
            <feOffset in="wide-shadow" dx="0" dy="10" result="wide-shadow-offset"/>

            <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="near-blur"/>
            <feFlood flood-color="#000000" flood-opacity="0.86" result="near-color"/>
            <feComposite in="near-color" in2="near-blur" operator="in" result="near-shadow"/>
            <feOffset in="near-shadow" dx="0" dy="8" result="near-shadow-offset"/>

            <feMerge>
                <feMergeNode in="wide-shadow-offset"/>
                <feMergeNode in="near-shadow-offset"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="radial-shadow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="52"/>
        </filter>
        <filter id="floor-soft" x="-25%" y="-120%" width="150%" height="340%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="8 5"/>
        </filter>
        <filter id="floor-core" x="-20%" y="-100%" width="140%" height="300%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="3 2.5"/>
        </filter>
    </defs>

    <circle cx="620" cy="565" r="235" fill="#000000" opacity="0.78" filter="url(#radial-shadow)"/>

    <g fill="#08090b">
        <ellipse cx="623" cy="808" rx="190" ry="23" opacity="0.58" filter="url(#floor-soft)"/>
        <ellipse cx="623" cy="804" rx="134" ry="12" opacity="0.76" filter="url(#floor-core)"/>
        <ellipse cx="555" cy="851" rx="78" ry="16" opacity="0.6" filter="url(#floor-soft)"/>
        <ellipse cx="555" cy="849" rx="48" ry="8" opacity="0.78" filter="url(#floor-core)"/>
    </g>

    <g filter="url(#subject-shadow)">
    <g fill="#f2f3f5" stroke="#25282e" stroke-width="8" stroke-linejoin="round" opacity="0.9">
        <path d="M611 424
