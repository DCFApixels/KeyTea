                 L657.1 698.2
                 C660.4 708.5 655.7 710 647 710
                 L592 710
                 C583.2 710 579.7 708.2 582.9 698.2
                 L601.2 636.9
                 C586.3 629.8 576 614.6 576 597
                 C576 572.7 595.7 553 620 553 Z"
